name: 更新数据并发布网站

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh:
        description: '抓取最新大师场近3天数据（保留原卡包对应关系）'
        required: true
        type: boolean
        default: true

concurrency:
  group: diamond-pages-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 保存更新前的数据备份
        if: github.event_name == 'workflow_dispatch' && inputs.refresh
        uses: actions/upload-artifact@v4
        with:
          name: data-before-update-${{ github.run_id }}
          path: data/
          retention-days: 7
      - uses: actions/setup-python@v5
        if: github.event_name == 'workflow_dispatch' && inputs.refresh
        with:
          python-version: '3.11'
      - name: 安装更新依赖
        if: github.event_name == 'workflow_dispatch' && inputs.refresh
        run: python -m pip install 'requests>=2.31,<3'
      - name: 抓取大师场最近3天数据
        if: github.event_name == 'workflow_dispatch' && inputs.refresh
        run: python .refresh/update_data.py --site-root .
      - name: 保存完整新快照
        if: github.event_name == 'workflow_dispatch' && inputs.refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh master last-three-days snapshot'
            git push origin HEAD:main
          fi
      - name: 打包静态网页
        run: |
          mkdir -p "$RUNNER_TEMP/diamond-site"
          cp index.html README.md .nojekyll "$RUNNER_TEMP/diamond-site/"
          cp -R static data "$RUNNER_TEMP/diamond-site/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/diamond-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
